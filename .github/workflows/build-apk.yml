name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: |
          flutter --version

      - name: Find Flutter project
        run: |
          test -f pubspec.yaml
          echo "Flutter project found"

      - name: Remove old Android project
        run: |
          rm -rf android
          echo "Old Android project removed"

      - name: Generate fresh Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.nexo \
            --project-name nexo_ai_video_maker \
            .

      - name: Check project structure
        run: |
          test -f pubspec.yaml
          test -d lib
          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle
          echo "Flutter Android project structure is OK"

      - name: Get Flutter dependencies
        run: |
          flutter pub get

      - name: Analyze Flutter project
        run: |
          flutter analyze

      - name: Build release APK
        run: |
          flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexo-ai-video-maker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
