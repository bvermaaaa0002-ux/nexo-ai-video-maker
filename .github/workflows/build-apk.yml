name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter and Dart version
        run: |
          flutter --version
          dart --version

      - name: Check Flutter project
        run: |
          test -f pubspec.yaml
          test -d lib
          echo "Flutter project found."

      - name: Create Android project if missing
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder missing. Creating Android project..."
            flutter create --platforms=android .
          else
            echo "Android folder already exists."
          fi

      - name: Remove generated test
        run: |
          rm -f test/widget_test.dart
          echo "Old widget test removed."

      - name: Verify Android project
        run: |
          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle
          echo "Android project verified."

      - name: Get Flutter dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Analyze Flutter project
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: |
          flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          echo "APK successfully created."
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
