name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: |
          flutter --version
          dart --version

      - name: Check repository
        run: |
          echo "Repository:"
          pwd
          echo "Files:"
          ls -la

      - name: Create Flutter project if needed
        run: |
          if [ ! -f pubspec.yaml ]; then
            echo "pubspec.yaml not found."
            echo "Creating a fresh Flutter project..."

            mkdir -p /tmp/nexo_flutter

            flutter create \
              --platforms=android \
              --org com.nexo \
              --project-name nexo_ai_video_maker \
              /tmp/nexo_flutter

            cp -r /tmp/nexo_flutter/. .
          else
            echo "Flutter project already exists."
          fi

      - name: Verify Flutter project
        run: |
          test -f pubspec.yaml
          test -d lib
          test -d android

          echo "Flutter project:"
          ls -la

          echo "pubspec.yaml:"
          cat pubspec.yaml

      - name: Get Flutter dependencies
        run: |
          flutter pub get

      - name: Analyze Flutter project
        run: |
          flutter analyze

      - name: Build release APK
        run: |
          flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexo-ai-video-maker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
