name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build NEXO AI APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: |
          flutter --version
          dart --version

      - name: Check Flutter project
        run: |
          test -f pubspec.yaml
          test -d lib
          test -f lib/main.dart
          echo "Flutter project OK"

      - name: Create Android project
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name nexo_ai .
          else
            echo "Android folder already exists"
          fi

      - name: Remove generated test
        run: |
          rm -f test/widget_test.dart
          echo "Generated widget test removed"

      - name: Get dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Analyze project
        run: |
          flutter analyze --no-fatal-infos

      - name: Build release APK
        run: |
          flutter build apk --release

      - name: Check APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
