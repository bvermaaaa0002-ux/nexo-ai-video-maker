name: Build Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: |
          flutter --version
          dart --version

      - name: Find Flutter project
        run: |
          echo "Current directory:"
          pwd

          echo "Repository files:"
          find . -maxdepth 2 -type f | sort

      - name: Create Flutter project if needed
        shell: bash
        run: |
          set -e

          if [ ! -f "./pubspec.yaml" ]; then
            echo "pubspec.yaml not found."
            echo "Creating fresh Flutter project..."

            rm -rf /tmp/nexo_flutter

            flutter create \
              --platforms=android \
              --org com.nexo \
              --project-name nexo_ai_video_maker \
              /tmp/nexo_flutter

            echo "Flutter project created."

            echo "Copying Flutter project into repository..."

            cp -a /tmp/nexo_flutter/. .

            echo "Files after copy:"
            ls -la
          else
            echo "Flutter project already exists."
          fi

      - name: Verify Flutter project
        shell: bash
        run: |
          set -e

          echo "Checking Flutter project..."

          if [ ! -f "./pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml is missing"
            exit 1
          fi

          if [ ! -d "./lib" ]; then
            echo "ERROR: lib directory is missing"
            exit 1
          fi

          if [ ! -d "./android" ]; then
            echo "ERROR: android directory is missing"
            exit 1
          fi

          echo "Flutter project structure is OK."

          echo "pubspec.yaml:"
          head -40 pubspec.yaml

      - name: Get Flutter dependencies
        run: |
          flutter pub get

      - name: Analyze Flutter project
        run: |
          flutter analyze

      - name: Build release APK
        run: |
          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexo-ai-video-maker-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
