
name: Build NEXO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create \
            --platforms=android \
            --project-name nexo_ai_video_maker \
            build_app

      - name: Copy NEXO source
        run: |
          cp flutter/pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib
          cp -R flutter/lib build_app/lib

      - name: Enable local HTTP
        run: |
          python - <<'PY'
          p = 'build_app/android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          s = s.replace(
              '<application ',
              '<application android:usesCleartextTraffic="true" ',
              1
          )
          open(p, 'w').write(s)
          PY

      - name: Get Flutter packages
        working-directory: build_app
        run: flutter pub get

      - name: Analyze Flutter project
        working-directory: build_app
        run: flutter analyze

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-release-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
