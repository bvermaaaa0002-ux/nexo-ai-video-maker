name: Build NEXO Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.0'
          cache: true

      # 4. Check installed versions
      - name: Check Flutter and Java
        run: |
          flutter --version
          dart --version
          java -version

      # 5. Find Flutter project
      - name: Find Flutter project
        shell: bash
        run: |
          echo "Searching for pubspec.yaml..."

          PROJECT_DIR="$(find . -maxdepth 5 -type f -name 'pubspec.yaml' \
            -not -path './.git/*' \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml was not found."
            echo ""
            echo "Your repository must contain a Flutter project."
            echo "Example:"
            echo "  pubspec.yaml"
            echo "  lib/"
            echo "  android/"
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "Flutter project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 6. Check Flutter project structure
      - name: Check project structure
        shell: bash
        run: |
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Project files:"
          ls -la "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/android" ]; then
            echo "WARNING: android directory not found."
            echo "Flutter may need to generate Android files."
          fi

      # 7. Get Flutter dependencies
      - name: Get Flutter dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      # 8. Analyze Flutter project
      - name: Analyze Flutter project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter analyze --no-fatal-infos
        continue-on-error: true

      # 9. Build release APK
      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release

      # 10. Find generated APK
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Searching for generated APK..."

          APK_PATH="$(find build/app/outputs/flutter-apk \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Build directory contents:"
            find build -maxdepth 6 -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully generated:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
