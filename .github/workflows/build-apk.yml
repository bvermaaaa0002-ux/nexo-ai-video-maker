name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter and Dart version
        run: |
          flutter --version
          dart --version

      - name: Check Flutter project
        run: |
          test -f pubspec.yaml
          test -d lib
          echo "Flutter project found successfully."

      - name: Create Android project if missing
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder is missing."
            flutter create --platforms=android .
          else
            echo "Android folder already exists."
          fi

      - name: Remove generated test
        run: |
          rm -f test/widget_test.dart
          echo "Generated widget test removed."

      - name: Verify Android project
        run: |
          test -d android

          if [ -f android/settings.gradle ]; then
            echo "Found android/settings.gradle"
          elif [ -f android/settings.gradle.kts ]; then
            echo "Found android/settings.gradle.kts"
          else
            echo "ERROR: Android settings file is missing."
            exit 1
          fi

          if [ -f android/app/build.gradle ]; then
            echo "Found android/app/build.gradle"
          elif [ -f android/app/build.gradle.kts ]; then
            echo "Found android/app/build.gradle.kts"
          else
            echo "ERROR: Android app build file is missing."
            exit 1
          fi

          echo "Android project verified successfully."

      - name: Get Flutter dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Analyze Flutter project
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: |
          flutter build apk --release

      - name: Verify APK
        run: |
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            echo "APK created successfully."
            ls -lh build/app/outputs/flutter-apk/app-release.apk
          else
            echo "ERROR: APK was not created."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
