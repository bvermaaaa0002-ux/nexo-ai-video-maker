name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Check Flutter project
        run: |
          test -f pubspec.yaml
          test -d lib
          echo "Flutter project files found."

      - name: Create Android project files
        run: |
          if [ ! -d "android" ]; then
            echo "Android folder missing. Creating it..."
            flutter create --platforms=android .
          else
            echo "Android folder already exists."
          fi

      - name: Verify Android project
        run: |
          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle
          echo "Android project is ready."

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXO-AI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
